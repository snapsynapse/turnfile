        Session 14 used the skill workflow for mailbox processing, PRD-021
        cross-review, PRD-017 fold re-verification, post-yield sync handling,
        and this role-keyed bundle migration after the May 2026 scope reset.
  spec_version: agentskills.io/1.0
  frontmatter_mode: minimal
